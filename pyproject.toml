[project]
name = "buddybird-audio-ai"
version = "1.4.1"
description = "BuddyBird parrot detection and mimic judgment Lambda functions"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "sentry-sdk>=2.69.2",
]

[dependency-groups]
parrot-detection = [
    "joblib>=1.4.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.19.0",
    "scikit-learn==1.9.0",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]
mimic-judgment = [
    "imageio-ffmpeg==0.6.0",
    "librosa==1.0.0",
    "numba==0.67.0",
    "torch==2.13.0",
    "transformers==5.16.1",
]
model-download = [
    "huggingface-hub>=0.24.0",
    "onnx>=1.23.2",
]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv]
default-groups = ["dev", "parrot-detection"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "ARG",
    "ASYNC",
    "B",
    "C4",
    "DTZ",
    "E",
    "ERA",
    "F",
    "FURB",
    "G",
    "I",
    "LOG",
    "N",
    "PERF",
    "PIE",
    "PT",
    "PTH",
    "RET",
    "RUF",
    "S",
    "SIM",
    "T20",
    "TID",
    "TRY",
    "UP",
    "W",
]
ignore = [
    "TRY003",
    "W191",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["boto3.*", "huggingface_hub.*", "joblib.*", "judge.*", "onnx.*", "onnxruntime.*", "soundfile.*", "soxr.*"]
ignore_missing_imports = true
