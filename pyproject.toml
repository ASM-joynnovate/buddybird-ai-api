[project]
name = "buddybird-audio-ai"
version = "1.2.0"
description = "BuddyBird vocal analysis API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35.0",
    "joblib>=1.4.0",
    "numpy>=2.5.3",
    "onnxruntime>=1.19.0",
    "scikit-learn>=1.5.0",
    "sentry-sdk>=2.69.2",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
]

[dependency-groups]
build = [
    "huggingface-hub>=0.24.0",
    "onnx>=1.23.2",
]
mimic = [
    "imageio-ffmpeg==0.6.0",
    "librosa==1.0.0",
    "numba==0.67.0",
    "torch==2.13.0",
    "transformers==5.16.1",
]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "N",
    "PT",
    "PTH",
    "RUF",
    "S",
    "SIM",
    "TRY",
    "UP",
]
ignore = [
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[[tool.mypy.overrides]]
module = ["boto3.*", "huggingface_hub.*", "joblib.*", "judge.*", "onnx.*", "onnxruntime.*", "soundfile.*", "soxr.*"]
ignore_missing_imports = true
