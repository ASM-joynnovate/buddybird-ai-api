name: deploy

on:
  push:
    branches:
      - main
  workflow_call:

permissions:
  contents: read

concurrency: deploy-${{ github.ref_name }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      WORKER_NAME: jn-buddybird-audio-ai-${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      IMAGE_REGISTRY: registry.cloudflare.com/0c4453da6d81adec04df8132e00660c4
      IMAGES: parrot-detection mimic-judgment
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      CLOUDFLARE_ACCOUNT_ID: 0c4453da6d81adec04df8132e00660c4
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: read version
        id: version
        run: |
          echo "version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" >> "$GITHUB_OUTPUT"
          echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: notify deploy start
        uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: 🚀 ${{ env.WORKER_NAME }} 배포 시작
          fields: |
            환경=${{ env.ENVIRONMENT }}
            버전=${{ steps.version.outputs.version }}
            실행자=${{ github.actor }}
            트리거=${{ github.event_name }} to ${{ github.ref_name }}
          buttons: |
            실행 로그=${{ env.RUN_URL }}
            변경 내역=${{ github.event.compare }}
          commit-range: ${{ github.event.before }}..${{ github.sha }}

      - name: install wrangler
        id: wrangler
        working-directory: worker
        run: npm ci

      - name: login to registry
        id: registry
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          credentials=$(npx wrangler containers registries credentials --pull --json)
          jq -r .password <<< "$credentials" | docker login --password-stdin --username "$(jq -r .username <<< "$credentials")" registry.cloudflare.com

      - name: ensure version is not in registry
        id: check-new-version
        if: github.ref_name == 'dev'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in $IMAGES; do
            if docker manifest inspect "$IMAGE_REGISTRY/jn-buddybird-$image:$VERSION"; then
              exit 1
            fi
          done

      - name: ensure version is in registry
        id: check-image-exists
        if: github.ref_name == 'main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in $IMAGES; do
            docker manifest inspect "$IMAGE_REGISTRY/jn-buddybird-$image:$VERSION"
          done

      - name: set up buildx
        id: buildx
        if: github.ref_name == 'dev'
        uses: docker/setup-buildx-action@v4

      - name: build parrot-detection image
        id: build-parrot-detection
        if: github.ref_name == 'dev'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.parrot-detection
          platforms: linux/amd64
          load: true
          tags: jn-buddybird-parrot-detection:${{ steps.version.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=parrot-detection
          cache-to: type=gha,mode=max,scope=parrot-detection

      - name: build mimic-judgment image
        id: build-mimic-judgment
        if: github.ref_name == 'dev'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.mimic-judgment
          platforms: linux/amd64
          load: true
          tags: jn-buddybird-mimic-judgment:${{ steps.version.outputs.version }}
          provenance: false
          cache-from: type=gha,scope=mimic-judgment
          cache-to: type=gha,mode=max,scope=mimic-judgment

      - name: push images
        id: push
        if: github.ref_name == 'dev'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          for image in $IMAGES; do
            npx wrangler containers push "jn-buddybird-$image:$VERSION"
          done

      - name: resolve image digests
        id: digest
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          images='{}'
          for image in $IMAGES; do
            repository="$IMAGE_REGISTRY/jn-buddybird-$image"
            digest=$(docker manifest inspect -v "$repository:$VERSION" | jq -er .Descriptor.digest)
            images=$(jq -c --arg name "$image" --arg image "$repository@$digest" '.[$name] = {image: $image}' <<< "$images")
          done
          echo "images=$images" >> "$GITHUB_OUTPUT"

      - name: deploy worker
        id: deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_SOURCES: ${{ steps.digest.outputs.images }}
        run: |
          jq --arg env "$ENVIRONMENT" --argjson images "$IMAGE_SOURCES" '.env[$env].containers[].images |= with_entries(.value = $images[.key])' wrangler.jsonc > wrangler.json
          mv wrangler.json wrangler.jsonc
          npx wrangler deploy --env "$ENVIRONMENT"

      - name: collect result
        id: result
        if: always()
        env:
          STEPS: ${{ toJSON(steps) }}
          STARTED: ${{ steps.version.outputs.started }}
        run: |
          echo "failed_step=$(jq -r '[to_entries[] | select(.value.conclusion == "failure") | .key][0] // ""' <<< "$STEPS")" >> "$GITHUB_OUTPUT"
          elapsed=$(( $(date +%s) - STARTED ))
          echo "duration=$(( elapsed / 60 ))m $(( elapsed % 60 ))s" >> "$GITHUB_OUTPUT"

      - name: notify deploy result
        if: always()
        uses: ./.github/actions/notify-slack
        continue-on-error: true
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          title: "${{ job.status == 'success' && '✅' || job.status == 'failure' && '❌' || '⚠️' }} ${{ env.WORKER_NAME }} 배포 ${{ job.status == 'success' && '성공' || job.status == 'failure' && '실패' || '취소' }}"
          fields: |
            환경=${{ env.ENVIRONMENT }}
            버전=${{ steps.version.outputs.version }}
            실행자=${{ github.actor }}
            트리거=${{ github.event_name }} to ${{ github.ref_name }}
            소요 시간=${{ steps.result.outputs.duration }}
            실패 step=${{ steps.result.outputs.failed_step }}
          buttons: |
            실행 로그=${{ env.RUN_URL }}
            변경 내역=${{ github.event.compare }}
          commit-range: ${{ github.event.before }}..${{ github.sha }}
